GENERAL:
  NUM_WORKERS: 8
  PIN_MEMORY: True
  LOG_STEPS: 100
  CHECKPOINT_STEPS: 5000
  VAL_CHECK_INTERVAL: 0.25
  SANITY_VAL_STEPS: 1
  SEED: 42

TRAIN:
  NUM_EPOCHS: 100
  # Chunks of 16 frames; the effective crop batch is BATCH_SIZE * 16.
  # 4 -> 45.6 GB peak. Throughput is flat in batch size at this resolution, so a
  # larger batch costs no wall-clock and only improves the gradient estimate;
  # 8 would need ~85 GB and would not fit an 80 GB H100.
  BATCH_SIZE: 4
  SHUFFLE: True
  # LR, WEIGHT_DECAY, LOSS_REDUCTION and LOSS_WEIGHTS below all match the
  # released weights/hawor/model_config.yaml. Raise LR to ~1e-4 if you keep the
  # backbone frozen and want the head phase to converge faster.
  LR: 1.0e-5
  WEIGHT_DECAY: 1.0e-4
  # 15 h/epoch at this resolution, so validate more often than once an epoch.
  # 'mean' (release default) averages the per-sample loss over the batch;
  # 'sum' is the HaMeR convention and makes the effective LR scale with B*16.
  LOSS_REDUCTION: mean
  GRAD_CLIP_VAL: 1.0
  # bf16 has no gradient scaler, so the manual clip_grad_norm_ in training_step
  # sees unscaled gradients. Do not switch to '16-mixed' while GRAD_CLIP_VAL > 0.
  PRECISION: bf16-mixed
  # Micro-steps per optimizer update. 1 = off. Implemented in
  # HaworFull.training_step, NOT via Trainer(accumulate_grad_batches=...):
  # this module uses manual optimization, where Lightning ignores that flag.
  # Peak memory tracks frames per step (16 is the ceiling without gradient
  # checkpointing), so accumulation is how a 64-frame update -- the released
  # recipe's batch -- is reached at 16-frame memory. --max_steps still counts
  # OPTIMIZER steps: Lightning's global_step advances on opt.step(), which under
  # this manual-optimization path fires once per ACCUM_STEPS micro-steps, so a
  # step budget carries over unchanged. Measured at 1024x768, fp8, no ckpt:
  # 5.304 s per 64-frame update via batch 1 x accum 4, against 11.111 s for
  # bf16 + checkpointing at batch 4 -- 2.09x at the same effective batch, and
  # 1.326 s per micro-step, i.e. accumulation itself costs nothing.
  ACCUM_STEPS: 1
  CHUNK_STRIDE: 8
  VAL_CHUNK_STRIDE: 64
  RENDER_LOG: True

MODEL:
  # 256 -> the backbone sees a 256x192 centre slice, matching the ViT-H path and
  # giving the 16x12 grid forward_step expects. Sapiens2 pretrained at 1024x768,
  # but the input here is an already-cropped hand: source frames are 704px
  # (HOT3D) / 840x600 (ARCTIC) and a hand box is ~200px, so feeding 1024x768
  # would upsample ~5x and add no real detail for 16x the tokens.
  # forward_step's slice and the wrapper's pooling both scale, so raising this
  # to 512 or 1024 works if you want to test that trade-off.
  IMAGE_SIZE: 256
  # Full-frame input, letterboxed, at Sapiens2's native pretraining scale.
  # Sapiens2's config says 1024x768 as HxW (portrait); five of the six datasets
  # are landscape (HOT3D is square 704x704), so this is the transpose -- the
  # same pixel count and patch grid, which is what RoPE and the patch embedding
  # care about.
  # NOTE this UPSAMPLES 93.8% of the corpus. Source sizes, letterbox scale into
  # 1024x768, canvas fill and share of an epoch's frame-slots:
  #   dexycb  640x480   1.600x  100.0%  39.4%     ho3d   640x480  1.600x  8.5%
  #   hot3d   704x704   1.091x   75.0%  22.1%     h2o   1280x720  0.800x  6.2%
  #   arctic  840x600   1.219x   95.2%  17.8%     h2o3d  640x480  1.600x  6.0%
  # Weighted mean 1.370x linear = 1.88x the source pixels; only H2O is genuinely
  # downsampled. DexYCB + HO3D + H2O3D are 53.9% of the epoch and are native
  # 640x480, so at INPUT 640x480 they would be pixel-exact -- the interpolation
  # up to 1024x768 costs 2.56x the tokens for no added information. Against
  # that, hand spans (median longest bbox side) fall from a corpus-weighted
  # 171px to 107px, where original HaWoR's 256x192 crop gave a hand ~213px.
  # The 5.70mm shift measured for 640x480 in scripts/probe_token_reduction.py
  # was measured on HOT3D, which 640x480 really does downsample (0.682x), so it
  # is a near-worst case for the corpus rather than a best one.
  # The backbone grid is 48x64 = 3072 tokens and is kept at full resolution:
  # MANOTwoHandHead flattens it into a cross-attention context and has only two
  # query tokens, so the context length is nearly free. Measured against the
  # pooled 16x12 grid at 384x512: identical peak memory, 1.7% slower per step.
  INPUT_H: 768
  INPUT_W: 1024
  # Feed each source at its OWN resolution instead of this canvas, padded up to
  # a multiple of the 16px patch, and never upsampled. INPUT_H/W then act only
  # as a ceiling: a source larger than them is still scaled down to fit, which
  # is why H2O (1280x720, whose native 3600 tokens would EXCEED the canvas)
  # stays at 1024x576 rather than getting its native grid.
  # Tokens per window, and share of an epoch's frame-slots:
  #   dexycb 640x480 -> 30x40 1200 (39.4%)   ho3d  640x480 -> 1200 ( 8.5%)
  #   hot3d  704x704 -> 44x44 1936 (22.1%)   h2o  1280x720 -> 1024x576
  #   arctic 840x600 -> 848x608 38x53 2014          -> 45x64 2304 ( 6.2%)
  #     (padded: 840 and 600 are NOT multiples of 16)
  #                                          h2o3d 640x480 -> 1200 ( 6.0%)
  # Weighted 1576 of 3072 tokens -> ~2.0x faster with no interpolation at all.
  # The cost is token budget on the hand, not information: the corpus-weighted
  # hand span falls from 10.7 tokens to 8.1 (a uniform 640x480 canvas would give
  # 6.7). Sapiens2 tolerates this by construction -- RoPE coordinates are
  # computed from the actual input each forward and normalized per axis to
  # [-1,1], and pretraining augmented the coordinate scale over a 4x range.
  # REQUIRES BATCH_SIZE 1: collate stacks (B,T,3,H,W), and windows now differ in
  # size between datasets and between jitter draws. A window's own 16 frames
  # always agree, being one sequence, so batch 1 needs no bucketing.
  NATIVE_RES: False
  # Resolution jitter, train only, multiplying the scale above. Replaces the
  # scale variation the fixed canvas used to supply -- without it every DexYCB
  # frame is 40x30 forever. Down only: scaling up would invent pixels, which is
  # what NATIVE_RES exists to avoid. Discrete rather than continuous so the
  # number of distinct tensor shapes stays bounded (4 source sizes x 3 levels =
  # 12), which matters because torch.compile builds a graph per shape and the
  # fp8 path needs compile to be worth anything.
  RES_JITTER_LEVELS: [1.0, 0.875, 0.75]
  # 0 = off. A token ceiling applied under NATIVE_RES, before jitter: any source
  # whose padded grid would exceed it is scaled down until it fits. Peak memory
  # is linear in tokens, so this is the direct way to state the memory limit,
  # and unlike CKPT_ABOVE_TOKENS it removes the large shapes rather than paying
  # to recompute them -- which lets GRAD_CHECKPOINT go off for the whole run.
  # The trade is resolution: at 1550, HOT3D caps at 0.895x native, ARCTIC 0.875x
  # and H2O 0.82x of its already-fitted size, so those three give up their top
  # detail. DexYCB/HO3D/H2O3D are unaffected, being 1200 tokens natively.
  MAX_TOKENS: 0
  # Frames per training window. It does NOT raise the memory ceiling: peak
  # memory tracks FRAMES PER STEP (batch x SEQ_LEN x 3072 tokens), so 8x4 OOMs
  # exactly as 16x2 does, and 16 frames/step is the limit without gradient
  # checkpointing however it is split. Measured at 1024x768, fp8, no ckpt:
  # seq_len 16 x batch 1 = 1.332 s/step, seq_len 8 x batch 2 = 1.315 s/step --
  # identical throughput for the same frame budget.
  # What halving does buy is 2 independent windows per step instead of 1, from
  # potentially different sequences, so the gradient is less correlated. The cost
  # is that the temporal module sees 8 frames of context instead of 16, which is
  # a modelling change a throughput number cannot evaluate.
  SEQ_LEN: 16
  BACKBONE:
    TYPE: sapiens2
    # Any checkpoint whose state_dict carries 'backbone.*' keys. The released
    # HaWoR checkpoint is the one the README already has you download, so it is
    # the default; for a genuine from-scratch reproduction point this at the
    # WiLoR (or HaMeR) ViT-H instead, since initializing from hawor.ckpt means
    # starting from an already-trained backbone.
    PRETRAINED_WEIGHTS: ''
    SAPIENS_DIR: weights/sapiens2_08b
    SAPIENS_BF16: True
    # Full fine-tune: no freezing, no LoRA. Measured at 45.6 GB peak for
    # BATCH_SIZE 4 and ~5.6 frames/s, so memory is not the binding constraint --
    # throughput is, and it is flat across batch size because the GPU is already
    # saturated at batch 1.
    FP8: False
    FREEZE: False
    LORA: False
    # Mandatory here. Without recomputation this config needs >99 GB and OOMs;
    # with it, 15.8 GB at batch 1. Costs ~30% step time.
    GRAD_CHECKPOINT: True
    # 0 = recompute every step. A positive N recomputes ONLY windows with more
    # than N patch tokens, which is what makes NATIVE_RES's varying input size
    # worth exploiting: peak memory is linear in tokens, measured at batch 1 on
    # a 96GB card with a full fine-tune and no recomputation --
    #   1089 tok 53.7 GB   1200 tok 58.6 GB   1521 tok 72.9 GB
    #   1936 tok 91.0 GB   2014 tok OOM       2304 tok OOM
    # so a blanket GRAD_CHECKPOINT: False crashes on ARCTIC and H2O while
    # leaving 78 GB unused on DexYCB. 1550 keeps the largest un-recomputed
    # window at 1521 tokens (72.9 GB, ~23 GB spare) and covers ~83% of an
    # epoch's windows: every DexYCB/HO3D/H2O3D window at any jitter level, plus
    # HOT3D and ARCTIC at the two lower levels. 1936 also fits but leaves under
    # 5 GB, which is not enough for a multi-day run.
    CKPT_ABOVE_TOKENS: 0
    # No POOL_GRID: keep the backbone's native 48x64 grid.
    TORCH_COMPILE: 0
    # Distinct input shapes Dynamo may compile before falling back to eager for
    # the rest of the run. Torch's default is 8; NATIVE_RES needs
    # (source sizes) x (jitter levels), which is 12 for this corpus, so the
    # default silently de-optimizes a third of the shapes. Keep it comfortably
    # above the shape count -- an unused slot costs nothing.
    RECOMPILE_LIMIT: 64
    # Both 0 = off. NUM_LAYERS keeps only the first N transformer blocks, for a
    # cheaper trunk than any released checkpoint offers (24 of the 0.8b's 32
    # measures 0.604B). TRAINABLE_LAYERS: positive K trains the FIRST K blocks,
    # negative trains the LAST |K|. Measured at 24 layers, 1024x768, ~equal
    # trainable params: first-16 8.333 s/step, last-16 6.250 s/step -- 1.33x,
    # purely because backward stops at the first trainable block. Negative is
    # also the conventional recipe: the blocks nearest the head should adapt.
    NUM_LAYERS: 0
    TRAINABLE_LAYERS: 0
    # 0 = off. Average-pools the patch grid 2x2 after this block, so the deeper
    # blocks run at a quarter of the tokens. Distinct from POOL_GRID, which
    # pools the trunk's OUTPUT and measured 1.7% SLOWER -- the cost is inside
    # the trunk. At 1024x768 the grid goes 64x48 -> 32x24, i.e. 16px -> 32px per
    # token, and a 155px hand still spans ~5 tokens; pooling twice leaves ~2.4,
    # which deccam has to resolve a (u, v) from.
    MIDTRUNK_POOL_AFTER: 0
    # Real fp8 training (torchao float8), as opposed to FP8 above which is
    # inference quantization and silently skips unless the trunk is frozen.
    # Needs TORCH_COMPILE or it is ~3x slower. MEASURED SLOWER THAN bf16 ON A
    # FULL FINE-TUNE: ~25 s/step vs 11.111, i.e. 0.44x, because gradient
    # checkpointing (mandatory here) recomputes the forward and so runs every
    # fp8 cast twice across 224 Linears. Leave it off for FREEZE: False.
    FP8_TRAINING: False
  # Warm-start head + motion module from the frozen-backbone full-frame run so
  # the 3D heads do not have to relearn placement from scratch while the
  # backbone is also moving. Loaded with strict=False: that checkpoint's
  # backbone weights are the untouched Sapiens2 pretrained ones (it was frozen),
  # so this restores heads and backbone in one load.
  WARM_START: logs/full_sapiens2_08b/checkpoints/last.ckpt
  # These match the released weights/hawor/model_config.yaml, verified by
  # loading hawor.ckpt into this config with strict=True. Change them only when
  # training a new architecture from scratch, not when using LOAD_WEIGHTS.
  ST_MODULE: False   # full-frame model attends over hand tokens, not grid cells
  ST_HDIM: 512
  ST_NLAYER: 6
  MOTION_MODULE: True
  MOTION_HDIM: 384
  MOTION_NLAYER: 6

MANO:
  DATA_DIR: data/
  MODEL_PATH: data/mano
  MODEL_PATH_LEFT: _DATA/data_left/mano_left
  GENDER: neutral
  NUM_HAND_JOINTS: 15
  MEAN_PARAMS: data/mano_mean_params.npz
  CREATE_BODY_POSE: False

# Verbatim from the released weights/hawor/model_config.yaml. Valid as-is under
# TRAIN.LOSS_REDUCTION: mean; re-tune if you switch to 'sum'.
LOSS_WEIGHTS:
  VISIBILITY: 0.01
  KEYPOINTS_2D: 0.01
  KEYPOINTS_3D: 0.05
  GLOBAL_ORIENT: 0.001
  HAND_POSE: 0.001
  BETAS: 0.0005

DATASETS:
  CONFIG:
    SCALE_FACTOR: 0.3
    TRANS_FACTOR: 0.02
    TRANS_AUG_RATE: 0.5
    COLOR_SCALE: 0.2
    BOX_DILATE: 1.2
    # The released config used ROT_FACTOR 30 / ROT_AUG_RATE 0.6, but this
    # reimplementation does not support in-plane rotation: it is only exact if
    # the principal point is moved to the crop centre, which would zero out the
    # CLIFF bbox feature. See lib/datasets/hawor_train_dataset.py.
    # yacs type-checks against hawor/configs/__init__.py, where ROT_FACTOR is an
    # int (30) and ROT_AUG_RATE a float (0.6). Keep the types.
    ROT_FACTOR: 0
    ROT_AUG_RATE: 0.0
    DO_FLIP: False
