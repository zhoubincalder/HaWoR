[project]
name = "hawor"
version = "0.1.0"
description = "HaWoR: World-Space Hand Motion Reconstruction from Egocentric Videos"
readme = "README.md"
# chumpy (required by smplx to unpickle the MANO models) calls
# inspect.getargspec, which was removed in Python 3.11.
requires-python = ">=3.10,<3.11"

# Core set: everything needed to preprocess the ground truth and train the
# camera-space hand motion estimator (lib/datasets/hawor_preprocess_train.py,
# train.py). The demo, SLAM and HOT3D toolkit dependencies live in the extras
# below so a fragile renderer build cannot block training.
dependencies = [
    "torch>=2.13,<2.14",
    "torchvision",
    "pytorch-lightning>=2.2",
    "tensorboard",
    "numpy==1.26.4",
    "opencv-python",
    "scikit-image",
    "scipy",
    "smplx==0.1.28",
    "chumpy",
    "timm",
    "einops",
    "yacs",
    # The released hawor.ckpt stores its Lightning hyper_parameters as an
    # omegaconf DictConfig, so unpickling it needs omegaconf importable.
    "omegaconf",
    "joblib",
    "tqdm",
    "natsort",
    "transformers>=5.15.0",
    "torchao>=0.18.0",
]

[project.optional-dependencies]
# Detection, tracking and rendering for demo.py / the eval scripts.
demo = [
    "ultralytics",
    "supervision",
    "pyrender",
    "aitviewer",
    "moderngl-window==2.4.6",
    "trimesh",
    "pillow",
    "lapx",
    "dill",
    "loguru",
    "easydict",
]
# Masked DROID-SLAM + Metric3D scale estimation.
slam = [
    "evo",
    "pytorch-minimize",
    "mmengine==0.10.4",
    "plyfile",
    "HTML4Vision",
    "matplotlib",
]
# HOT3D download + export toolkit under hot3d/.
hot3d = [
    "projectaria-tools",
    "pandas",
    "rerun-sdk",
]

[tool.uv]
# The repo is run from its root via sys.path, not installed as a package.
package = false

# chumpy's setup.py imports pip without declaring it as a build requirement.
[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

# CUDA 13.0 wheels. Blackwell (sm_120, e.g. RTX PRO 6000) needs at least cu128;
# the torch 1.13 + cu117 combination in the README predates it and fails with
# "no kernel image is available for execution on the device".
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# PyPI chumpy 0.70 imports np.bool/np.int/np.float, removed in numpy>=1.24.
chumpy = { git = "https://github.com/mattloper/chumpy" }

# pytorch3d and torch-scatter are deliberately NOT listed: both compile
# extensions against the already-installed torch, which cannot be resolved from
# an sdist during locking. Neither is needed for training -- pytorch3d is only
# used by lib/vis/renderer*.py and torch-scatter only by DROID-SLAM. Install
# them after `uv sync`, when you need the demo or SLAM stage:
#   uv pip install --no-build-isolation "git+https://github.com/facebookresearch/pytorch3d.git@stable"
#   uv pip install --no-build-isolation torch-scatter==2.1.2
